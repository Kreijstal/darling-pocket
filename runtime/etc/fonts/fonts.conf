<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig configuration for darling-pocket.
     Installed on device as /data/data/dev.kreijstal.darlingpocket/files/etc/fonts/fonts.conf (the compiled-in
     default); FONTCONFIG_FILE overrides it at runtime. -->
<fontconfig>
	<dir>/system/fonts</dir>
	<dir>/data/data/dev.kreijstal.darlingpocket/files/darling/libexec/darling/System/Library/Fonts</dir>
	<dir>/data/data/dev.kreijstal.darlingpocket/files/darling/libexec/darling/Library/Fonts</dir>

	<cachedir>/data/data/dev.kreijstal.darlingpocket/cache/fontconfig</cachedir>

	<include ignore_missing="yes">conf.d</include>

	<config>
		<rescan><int>30</int></rescan>
	</config>
</fontconfig>
